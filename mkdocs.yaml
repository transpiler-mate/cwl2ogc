site_name: CWL to OGC
site_url: https://transpiler-mate.github.io/cwl2ogc/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/transpiler-mate/cwl2ogc/
repo_name: transpiler-mate/cwl2ogc

theme:
    logo: imgs/icon-eoap.png
    name: readthedocs

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 11.4.1
  - mkdocs-jupyter:
      execute: true
      show_input: True
      no_input: False
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

extra_css:
  - styles/css/app.css
  
extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Your first conversion: tutorials/first-conversion.md
    - Essential input parameters: essential-input-parameters.ipynb
    - Array inputs: array-inputs.ipynb
    - Records and unions: inclusive-exclusive-inputs.ipynb
    - Exclusive parameters with expressions: exclusive-input-parameters-expressions.ipynb
    - Document graphs: graph.ipynb
    - Complex CWL types: complex-cwl-types.ipynb
    - Imported CWL types: imported-cwl-types.ipynb
    - String formats: string-formats.ipynb
    - JSON Schema validation: schema.ipynb
  - How-to guides:
    - Convert with the plugin: plugin.md
    - Generate and validate JSON Schema: how-to/json-schema.md
  - Reference:
    - Python API: api.md
    - Plugin CLI and output: reference/plugin.md
  - Explanation:
    - Conversion model: explanation/conversion-model.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
